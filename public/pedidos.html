<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100D0A">
<title>Pedidos · Super Johnny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100D0A; --panel:#171310; --card:#1E1914; --brd:rgba(255,255,255,.11);
    --mustard:#F0A934; --ember:#E1552F; --green:#3DBE6B; --cream:#FFF7E8; --dim:#C9BFAE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* PIN */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--brd);border-radius:26px;padding:30px 24px;text-align:center;}
  .login h1{font-family:'Anton',sans-serif;font-weight:400;font-size:2rem;margin:0;color:var(--mustard);letter-spacing:.02em;}
  .login p{color:var(--dim);font-size:.88rem;margin:6px 0 20px;}
  .login input[type=password]{width:100%;font-size:1.6rem;text-align:center;letter-spacing:.3em;padding:14px;border-radius:16px;border:1.5px solid var(--brd);background:#0c0a08;color:var(--cream);outline:none;}
  .login input[type=password]:focus{border-color:var(--mustard);}
  .login label input{width:18px;height:18px;margin:0;accent-color:var(--mustard);}
  .login label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 0;color:var(--dim);font-size:.82rem;}
  .btn-main{margin-top:18px;width:100%;background:var(--mustard);color:#1a1408;border:none;border-radius:100px;padding:15px;font-weight:800;font-size:1rem;}
  .login-err{color:#FFB199;font-size:.85rem;min-height:1.2em;margin:12px 0 0;}

  /* barra superior */
  .top{position:sticky;top:0;z-index:10;background:rgba(16,13,10,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--brd);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;}
  .brand{font-family:'Anton',sans-serif;font-size:1.35rem;color:var(--mustard);letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:10px;}
  .clock{font-family:'Sora',system-ui,sans-serif;font-weight:700;font-size:.95rem;color:var(--cream);}
  .conn{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(61,190,107,.18);}
  .conn.bad{background:var(--ember);box-shadow:0 0 0 4px rgba(225,85,47,.25);}
  .group{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--dim);}
  .seg{display:flex;background:#0c0a08;border:1px solid var(--brd);border-radius:100px;padding:3px;}
  .seg button{background:none;border:none;color:var(--dim);font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:100px;min-width:44px;}
  .seg button.on{background:var(--mustard);color:#1a1408;}
  .switch{display:flex;align-items:center;gap:10px;background:#0c0a08;border:1px solid var(--brd);border-radius:100px;padding:6px 14px 6px 6px;font-weight:700;font-size:.85rem;color:var(--cream);}
  .switch i{width:44px;height:26px;border-radius:100px;background:#3a332c;position:relative;transition:background .2s;}
  .switch i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
  .switch.on i{background:var(--green);}
  .switch.on i:after{left:21px;}
  .icon-btn{background:#0c0a08;border:1px solid var(--brd);color:var(--cream);border-radius:100px;padding:9px 14px;font-weight:700;font-size:.8rem;}

  .banner{margin:12px 16px 0;padding:12px 16px;border-radius:14px;font-weight:700;font-size:.9rem;}
  .banner.warn{background:rgba(225,85,47,.15);border:1px solid rgba(225,85,47,.5);color:#FFB199;}
  .banner.info{background:rgba(240,169,52,.1);border:1px solid rgba(240,169,52,.35);color:var(--mustard);}

  /* columnas */
  .board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 16px 30px;align-items:start;}
  @media (max-width:900px){ .board{grid-template-columns:1fr;} }
  .col h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:4px 4px 10px;display:flex;align-items:center;gap:8px;}
  .col h2 b{background:#2a231d;color:var(--cream);border-radius:100px;padding:2px 9px;font-size:.78rem;letter-spacing:0;}
  .col.new h2{color:var(--mustard);}
  .empty{color:#6f655a;font-size:.85rem;padding:18px;border:1.5px dashed #2c251f;border-radius:18px;text-align:center;}

  .card{background:var(--card);border:1px solid var(--brd);border-radius:20px;padding:16px;margin-bottom:12px;}
  .card.new{border:2px solid var(--mustard);animation:glow 1.4s ease-in-out infinite;}
  @keyframes glow{50%{box-shadow:0 0 0 6px rgba(240,169,52,.18);}}
  .card.review{border:2px solid var(--ember);}
  .card-head{display:flex;align-items:baseline;gap:10px;}
  .code{font-family:'Anton',sans-serif;font-size:2.1rem;line-height:1;color:var(--mustard);letter-spacing:.04em;}
  .who{font-weight:800;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .age{font-size:.8rem;color:var(--dim);font-weight:700;white-space:nowrap;}
  .age.late{color:#FFB199;}
  .meta{font-size:.75rem;color:var(--dim);margin:6px 0 10px;}
  .meta b{color:var(--green);}
  .items{list-style:none;margin:0;padding:0;}
  .items li{padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.98rem;line-height:1.35;}
  .items li:first-child{border-top:none;}
  .items .q{display:inline-block;min-width:30px;font-weight:800;color:var(--mustard);}
  .items small{display:block;color:var(--dim);font-size:.82rem;margin-left:30px;}
  .note{margin-top:10px;background:rgba(240,169,52,.12);border-left:3px solid var(--mustard);border-radius:8px;padding:9px 12px;font-size:.9rem;font-weight:600;}
  .alert{margin-top:10px;background:rgba(225,85,47,.15);border-radius:8px;padding:9px 12px;font-size:.82rem;color:#FFB199;font-weight:600;}
  .actions{display:flex;gap:8px;margin-top:14px;}
  .act{flex:1;border:none;border-radius:14px;padding:15px 10px;font-weight:800;font-size:1rem;}
  .act.go{background:var(--mustard);color:#1a1408;}
  .act.ok{background:var(--green);color:#08200f;}
  .act.ghost{flex:0 0 auto;background:transparent;border:1.5px solid var(--brd);color:var(--dim);font-size:.8rem;padding:12px 14px;}
  .total{font-weight:800;}

  .done-toggle{margin:4px 16px 0;background:none;border:none;color:var(--dim);font-size:.85rem;text-decoration:underline;}
  .done-list{padding:8px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .done-item{background:#14110e;border:1px solid var(--brd);border-radius:14px;padding:10px 14px;font-size:.82rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;align-items:center;}
  .done-item b{color:var(--cream);}
  .done-item button{background:none;border:1px solid var(--brd);color:var(--dim);border-radius:100px;padding:5px 10px;font-size:.72rem;}

  .sound-gate{position:fixed;inset:0;z-index:50;background:rgba(6,4,3,.86);display:flex;align-items:center;justify-content:center;padding:24px;}
  .sound-gate div{max-width:360px;text-align:center;}
  .sound-gate p{color:var(--dim);font-size:.9rem;}
</style>
</head>
<body>

<section class="login" id="login">
  <div class="login-card">
    <h1>PEDIDOS</h1>
    <p>Super Johnny · Tablero de cocina y caja</p>
    <input type="password" inputmode="numeric" autocomplete="off" id="pinInput" placeholder="PIN" aria-label="PIN">
    <label><input type="checkbox" id="pinRemember" checked> Recordar en esta tablet</label>
    <button class="btn-main" id="pinBtn">Entrar</button>
    <p class="login-err" id="pinErr"></p>
  </div>
</section>

<section id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="conn" id="conn" title="Conexión"></span>SUPER JOHNNY · PEDIDOS</div>
    <button class="switch on" id="acceptSwitch" type="button"><i></i><span id="acceptLabel">Recibiendo pedidos</span></button>
    <div class="group">Espera
      <div class="seg" id="waitSeg">
        <button data-w="10">10</button><button data-w="15">15</button><button data-w="20">20</button><button data-w="30">30</button><button data-w="45">45</button>
      </div>min
    </div>
    <button class="icon-btn" id="soundTest" type="button">🔔 Probar sonido</button>
    <div class="clock" id="clock"></div>
  </header>
  <div id="banners"></div>
  <main class="board">
    <section class="col new"><h2>Nuevos <b id="cNew">0</b></h2><div id="colNew"></div></section>
    <section class="col"><h2>En preparación <b id="cPrep">0</b></h2><div id="colPrep"></div></section>
    <section class="col"><h2>Listos para entregar <b id="cReady">0</b></h2><div id="colReady"></div></section>
  </main>
  <button class="done-toggle" id="doneToggle" type="button">Ver entregados hoy (0)</button>
  <div class="done-list hidden" id="doneList"></div>
</section>

<div class="sound-gate hidden" id="soundGate">
  <div>
    <h2>Activar sonido</h2>
    <p>El navegador necesita un toque para poder sonar cuando llegue un pedido.</p>
    <button class="btn-main" id="soundGateBtn">Activar sonido y continuar</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var PIN_KEY = 'sj_board_pin';
  var PIN = '';
  var POLL_MS = 6000;
  var state = { orders: [], settings: null, hours: null };
  var lastOk = 0, pollTimer = null, showDone = false, busy = {};
  var seenNew = {};

  function $(id){ return document.getElementById(id); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }

  function api(method, body){
    return fetch('/api/board', {
      method: method,
      headers: Object.assign({'x-pin': PIN}, body ? {'Content-Type':'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store'
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ d._status = r.status; d._ok = r.ok; return d; }); });
  }

  /* ---------- sonido ---------- */
  var actx = null;
  function unlockAudio(){
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch(e){}
  }
  function beep(){
    if (!actx) return;
    try {
      var t = actx.currentTime;
      [0, 0.22, 0.44].forEach(function(off, i){
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square';
        o.frequency.value = i === 2 ? 1320 : 990;
        g.gain.setValueAtTime(0.0001, t + off);
        g.gain.exponentialRampToValueAtTime(0.35, t + off + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.18);
        o.connect(g); g.connect(actx.destination);
        o.start(t + off); o.stop(t + off + 0.2);
      });
    } catch(e){}
    try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  }
  var alarmTimer = null;
  function updateAlarm(){
    var pending = state.orders.some(function(o){ return o.status === 'paid' || o.status === 'review'; });
    if (pending && !alarmTimer){ beep(); alarmTimer = setInterval(beep, 4000); }
    if (!pending && alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; }
    var n = state.orders.filter(function(o){ return o.status === 'paid'; }).length;
    document.title = n ? '(' + n + ') ¡NUEVO PEDIDO! · Super Johnny' : 'Pedidos · Super Johnny';
  }

  /* ---------- pantalla encendida ---------- */
  var wakeLock = null;
  function keepAwake(){
    try { if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; }).catch(function(){}); } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ keepAwake(); poll(); } });

  /* ---------- login ---------- */
  function tryLogin(pin, silent){
    PIN = pin;
    return api('POST', {action:'login'}).then(function(d){
      if (d._ok){
        if ($('pinRemember').checked || silent) store(PIN_KEY, pin);
        $('login').classList.add('hidden');
        $('app').classList.remove('hidden');
        if (silent) $('soundGate').classList.remove('hidden');
        else { unlockAudio(); keepAwake(); }
        poll();
        return true;
      }
      if (silent) store(PIN_KEY, null);
      $('pinErr').textContent = d.error || 'No se pudo entrar.';
      return false;
    }).catch(function(){ $('pinErr').textContent = 'Sin conexión. Revisa el internet.'; });
  }
  $('pinBtn').addEventListener('click', function(){ unlockAudio(); var v = $('pinInput').value.trim(); if (v) tryLogin(v, false); });
  $('pinInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('pinBtn').click(); });
  $('soundGateBtn').addEventListener('click', function(){ unlockAudio(); keepAwake(); $('soundGate').classList.add('hidden'); beep(); });
  $('soundTest').addEventListener('click', function(){ unlockAudio(); beep(); });

  /* ---------- datos ---------- */
  function poll(){
    clearTimeout(pollTimer);
    api('GET').then(function(d){
      if (d._status === 401){ store(PIN_KEY, null); location.reload(); return; }
      if (!d._ok) throw new Error(d.error || 'error');
      lastOk = Date.now();
      state.orders = d.orders || [];
      state.settings = d.settings;
      state.hours = d.hours;
      state.offset = new Date(d.serverTime).getTime() - Date.now();
      render(); tick();
    }).catch(function(){ renderConn(); }).then(function(){
      pollTimer = setTimeout(poll, POLL_MS);
    });
  }

  function setStatus(id, status){
    if (busy[id]) return;
    busy[id] = true;
    api('POST', {action:'status', id:id, status:status}).then(function(d){
      busy[id] = false;
      if (!d._ok){ alert(d.error || 'No se pudo actualizar.'); return; }
      state.orders = state.orders.map(function(o){ return o.id === id ? d.order : o; });
      render();
    }).catch(function(){ busy[id] = false; alert('Sin conexión. Intenta de nuevo.'); });
  }

  function saveSettings(patch){
    api('POST', Object.assign({action:'settings'}, patch)).then(function(d){
      if (d._ok){ state.settings = d.settings; renderTop(); }
      else alert(d.error || 'No se pudo guardar.');
    });
  }
  $('acceptSwitch').addEventListener('click', function(){
    if (!state.settings) return;
    var next = !state.settings.accepting;
    if (!next && !confirm('¿Pausar los pedidos en línea? Los clientes no podrán pagar en la página hasta que lo vuelvas a activar.')) return;
    saveSettings({accepting: next});
  });
  $('waitSeg').addEventListener('click', function(e){
    var b = e.target.closest('button[data-w]');
    if (b) saveSettings({waitMinutes: parseInt(b.dataset.w, 10)});
  });
  $('doneToggle').addEventListener('click', function(){ showDone = !showDone; render(); });

  /* ---------- render ---------- */
  function now(){ return Date.now() + (state.offset || 0); }
  function minsSince(iso){ return Math.max(0, Math.floor((now() - new Date(iso).getTime()) / 60000)); }
  function hhmm(iso){ try { return new Date(iso).toLocaleTimeString('es-MX', {hour:'numeric', minute:'2-digit'}); } catch(e){ return ''; } }

  function renderConn(){
    var bad = Date.now() - lastOk > POLL_MS * 3;
    $('conn').classList.toggle('bad', bad);
    var b = '';
    if (bad) b += '<div class="banner warn">⚠️ Sin conexión con el servidor. Revisa el internet de la tablet. Los pedidos pagados no se pierden: aparecerán al reconectar.</div>';
    if (state.settings && !state.settings.accepting) b += '<div class="banner info">Pedidos en línea en pausa: los clientes no pueden pagar en la página.</div>';
    else if (state.hours && !state.hours.orderable) b += '<div class="banner info">Fuera de horario: la página no acepta pagos en este momento.</div>';
    $('banners').innerHTML = b;
  }

  function renderTop(){
    var s = state.settings || {};
    $('acceptSwitch').classList.toggle('on', !!s.accepting);
    $('acceptLabel').textContent = s.accepting ? 'Recibiendo pedidos' : 'Pedidos en pausa';
    [].forEach.call($('waitSeg').querySelectorAll('button'), function(b){ b.classList.toggle('on', parseInt(b.dataset.w,10) === s.waitMinutes); });
    renderConn();
  }

  function card(o){
    var since = o.paidAt || o.createdAt;
    var age = minsSince(since);
    var late = (o.status === 'paid' || o.status === 'preparing') && o.waitMinutes && age >= o.waitMinutes;
    var items = o.lines.map(function(l){
      return '<li><span class="q">' + l.qty + '×</span>' + esc(l.name) + (l.detail ? '<small>' + esc(l.detail) + '</small>' : '') + '</li>';
    }).join('');
    var actions = '';
    if (o.status === 'paid') actions = '<button class="act go" data-act="preparing" data-id="' + o.id + '">Aceptar y preparar</button>';
    else if (o.status === 'preparing') actions = '<button class="act ok" data-act="ready" data-id="' + o.id + '">¡Listo!</button><button class="act ghost" data-act="paid" data-id="' + o.id + '">↩</button>';
    else if (o.status === 'ready') actions = '<button class="act ok" data-act="delivered" data-id="' + o.id + '">Entregado</button><button class="act ghost" data-act="preparing" data-id="' + o.id + '">↩</button>';
    else if (o.status === 'review') actions = '<button class="act go" data-act="preparing" data-id="' + o.id + '">Ya lo revisé, preparar</button>';
    actions += '<button class="act ghost" data-act="cancelled" data-id="' + o.id + '">Cancelar</button>';
    var alerts = '';
    if (o.status === 'review') alerts += '<div class="alert">El monto pagado no coincide con el pedido. Revisa el pago ' + esc(o.paymentId) + ' en Mercado Pago antes de preparar.</div>';
    if (o.duplicatePayments && o.duplicatePayments.length) alerts += '<div class="alert">Este cliente pagó dos veces. Reembolsa el pago ' + esc(o.duplicatePayments.join(', ')) + ' desde Mercado Pago.</div>';
    return '<article class="card' + (o.status === 'paid' ? ' new' : '') + (o.status === 'review' ? ' review' : '') + '">' +
      '<div class="card-head"><span class="code">' + esc(o.code) + '</span><span class="who">' + esc(o.name || 'Sin nombre') + '</span>' +
      '<span class="age' + (late ? ' late' : '') + '">' + (o.status === 'ready' && o.readyAt ? 'listo ' + hhmm(o.readyAt) : 'hace ' + age + ' min') + '</span></div>' +
      '<div class="meta">PARA LLEVAR · <b>PAGADO $' + o.total + '</b> · ' + hhmm(since) + (o.waitMinutes ? ' · prometido en ' + o.waitMinutes + ' min' : '') + '</div>' +
      '<ul class="items">' + items + '</ul>' +
      (o.note ? '<div class="note">📝 ' + esc(o.note) + '</div>' : '') + alerts +
      '<div class="actions">' + actions + '</div></article>';
  }

  function render(){
    renderTop();
    var by = function(st){ return state.orders.filter(function(o){ return st.indexOf(o.status) !== -1; }); };
    var nw = by(['paid','review']), pr = by(['preparing']), rd = by(['ready']), dn = by(['delivered','cancelled']);
    $('cNew').textContent = nw.length; $('cPrep').textContent = pr.length; $('cReady').textContent = rd.length;
    $('colNew').innerHTML = nw.length ? nw.map(card).join('') : '<div class="empty">Sin pedidos nuevos</div>';
    $('colPrep').innerHTML = pr.length ? pr.map(card).join('') : '<div class="empty">Nada en preparación</div>';
    $('colReady').innerHTML = rd.length ? rd.map(card).join('') : '<div class="empty">Nada pendiente de entregar</div>';
    $('doneToggle').textContent = (showDone ? 'Ocultar' : 'Ver') + ' entregados hoy (' + dn.length + ')';
    $('doneList').classList.toggle('hidden', !showDone);
    $('doneList').innerHTML = dn.slice().reverse().map(function(o){
      return '<div class="done-item"><span><b>' + esc(o.code) + '</b> ' + esc(o.name || '') + ' · $' + o.total + (o.status === 'cancelled' ? ' · <span style="color:#FFB199">cancelado</span>' : '') + '</span>' +
        (o.status === 'delivered' ? '<button data-act="ready" data-id="' + o.id + '">Regresar</button>' : '') + '</div>';
    }).join('');
    nw.forEach(function(o){ seenNew[o.id] = true; });
    updateAlarm();
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-act][data-id]');
    if (!b) return;
    unlockAudio();
    var act = b.dataset.act, id = b.dataset.id;
    if (act === 'cancelled' && !confirm('¿Cancelar este pedido? El cliente ya pagó: tendrás que reembolsarlo desde Mercado Pago.')) return;
    setStatus(id, act);
  });

  function tick(){
    var d = new Date(now());
    $('clock').textContent = d.toLocaleTimeString('es-MX', {hour:'numeric', minute:'2-digit'});
  }
  setInterval(function(){ tick(); if (!$('app').classList.contains('hidden')) { renderConn(); } }, 15000);
  tick();

  var saved = store(PIN_KEY);
  if (saved) tryLogin(saved, true);
})();
</script>
</body>
</html>
