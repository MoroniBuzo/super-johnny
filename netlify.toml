[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo listo"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/pedidos*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
